<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Panel OficiosOsIA</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#18191b">
<link rel="icon" type="image/svg+xml" href="logo/oficiososia-icono-app.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px var(--gutter); }
  .login__caja { width: 100%; max-width: 400px; border: 2px solid var(--linea); background: var(--noche-2); padding: 32px; display: flex; flex-direction: column; gap: 24px; }
  .login__marca { display: flex; align-items: center; gap: 10px; }
  .login__marca .wordmark { font-size: 22px; }
  .login h1 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 700; font-size: 32px; letter-spacing: -0.035em; line-height: 1.05; }
  .login p { margin: 0; font-size: 13px; line-height: 1.6; opacity: 0.8; }
  .login form { display: flex; flex-direction: column; gap: 16px; border-top: 2px solid var(--linea); padding-top: 20px; }
  .login label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
  .login input { background: var(--noche); border: 2px solid var(--linea); color: var(--claro); padding: 12px; font-size: 15px; border-radius: 0; outline: none; }
  .login input:focus { border-color: var(--ambar); }
  .login button { background: var(--ambar); color: var(--noche); border: 0; padding: 14px 20px; font-size: 14px; font-weight: 500; text-align: left; cursor: pointer; }
  .login button:hover { background: var(--ambar-hover); }
  .login button:disabled { opacity: 0.7; cursor: progress; }
  .login__error { margin: 0; font-size: 12px; color: var(--aviso); }
</style>
</head>
<body>
<main class="login">
  <div class="login__caja">
    <div class="login__marca">
      <svg width="44" height="23" viewBox="0 24 100 52" aria-hidden="true"><circle cx="24" cy="50" r="17" fill="none" stroke="#eeece8" stroke-width="10"/><rect x="41" y="45" width="18" height="10" fill="#eeece8"/><circle cx="76" cy="50" r="22" fill="#ffb000"/></svg>
      <span class="wordmark">OficiosOs<span class="ia">IA</span></span>
    </div>
    <div>
      <h1>Panel interno</h1>
      <p>La oficina de los becarios y el equipo de producto.</p>
    </div>
    <form data-login>
      <label>Usuario<input name="usuario" autocomplete="username" required autofocus></label>
      <label>Contraseña<input name="contrasena" type="password" autocomplete="current-password" required></label>
      <p class="login__error" data-error role="alert" hidden></p>
      <button type="submit">Entrar →</button>
    </form>
  </div>
</main>
<script>
  (function () {
    var form = document.querySelector('[data-login]');
    var error = form.querySelector('[data-error]');
    var boton = form.querySelector('button');
    // Solo se vuelve a rutas del propio panel, nunca a otro dominio.
    var volver = new URLSearchParams(location.search).get('volver') || '/';
    if (volver.charAt(0) !== '/' || volver.charAt(1) === '/' || volver.charAt(1) === '\\') volver = '/';
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      error.hidden = true;
      boton.disabled = true;
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario: form.elements.usuario.value, contrasena: form.elements.contrasena.value }),
      })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, datos: d }; }); })
        .then(function (res) {
          // El servidor no ve el #pestaña; el navegador lo conserva en la URL del login.
          if (res.ok) { location.replace(volver.indexOf('#') === -1 ? volver + location.hash : volver); return; }
          error.textContent = res.datos.error || 'No se ha podido entrar.';
          error.hidden = false;
          boton.disabled = false;
          form.elements.contrasena.select();
        })
        .catch(function () {
          error.textContent = 'Sin conexión con el servidor. Inténtalo de nuevo.';
          error.hidden = false;
          boton.disabled = false;
        });
    });
  })();
</script>
</body>
</html>
